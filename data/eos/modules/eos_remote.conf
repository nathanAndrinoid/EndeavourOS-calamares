#
### eos_remote Module
#
# Show-phase page that collects SSH and KRDP configuration from the user.
# On leaving the page, writes /tmp/eos-installer-ssh.conf which is read by
# ssh_setup_script.sh during the exec phase.
#
# All options default to disabled; the user must explicitly enable them.
#
---
# Look for the QML form in the compiled-in QRC resources.
qmlSearch: qrc
